name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Системные библиотеки для Qt и звука
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 fonts-dejavu-core
      - name: Зависимости
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Статическая проверка
        run: python -m pyflakes jarvis tools tests
      - name: Анализатор кода (сеть и процессы без времени ожидания, кодировки, вечные ожидания)
        run: python tools/doctor.py --strict
      - name: Тесты
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
