name: Release

# Новая версия: поднять __version__ в jarvis/__init__.py и отправить в main.
# Если релиза с таким номером ещё нет, сборка создаст Jarvis-Setup.exe и выложит его в Releases
# (тег vX.Y.Z создаётся вместе с релизом); установленные Джарвисы предложат обновиться.
# Если релиз уже есть, ничего не собирается. Ручной запуск с publish=false только собирает файл как артефакт.
on:
  push:
    branches: [main]
    paths: ["jarvis/**", "packaging/**", "tools/**", "requirements.txt", ".github/workflows/release.yml"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Выложить релиз (если такой версии ещё нет)"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      needed: ${{ steps.v.outputs.needed }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('jarvis/__init__.py', encoding='utf-8').read()).group(1))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          PUBLISH=true
          [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.publish }}" == "false" ]] && PUBLISH=false
          NEEDED=true
          if [[ "$PUBLISH" == "true" ]] && gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Релиз v$VERSION уже есть. Чтобы выпустить новый, поднимите __version__ в jarvis/__init__.py."
            NEEDED=false
          fi
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "needed=$NEEDED" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"            # на Windows Python по умолчанию читает и печатает в cp1252
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Версия
        run: |
          VERSION=$(python -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('jarvis/__init__.py', encoding='utf-8').read()).group(1))")
          echo "JARVIS_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Версия: $VERSION"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Тег $GITHUB_REF_NAME не совпадает с версией v$VERSION из jarvis/__init__.py" | tee -a build.log
            exit 1
          fi

      - name: Зависимости
        run: pip install -r requirements.txt -r requirements-dev.txt 2>&1 | tee -a build.log

      - name: Значок
        run: python tools/make_icon.py packaging/jarvis.ico 2>&1 | tee -a build.log
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Сборка приложения
        run: pyinstaller --noconfirm packaging/jarvis.spec 2>&1 | tee -a build.log

      - name: Сборка инструментов ПК
        run: pyinstaller --noconfirm packaging/jarvis-pc.spec 2>&1 | tee -a build.log

      - name: Проверка инструментов ПК
        run: ./dist/pc/jarvis-pc.exe now 2>&1 | tee -a build.log

      - name: Проверка собранного приложения
        shell: pwsh
        timeout-minutes: 3
        env:
          QT_QPA_PLATFORM: offscreen
          JARVIS_HOME: ${{ runner.temp }}\jarvis-smoke
          HERMES_HOME: ${{ runner.temp }}\hermes-smoke
        run: |
          $p = Start-Process -FilePath "dist\Jarvis\Jarvis.exe" -ArgumentList "--smoke" -Wait -PassThru
          $out = if (Test-Path "$env:JARVIS_HOME\smoke.txt") { Get-Content "$env:JARVIS_HOME\smoke.txt" -Raw } else { "smoke.txt не создан" }
          "smoke: код $($p.ExitCode); $out" | Tee-Object -FilePath build.log -Append
          if ($p.ExitCode -ne 0 -or $out.Trim() -ne "ok") { exit 1 }

      - name: Установщик
        run: |
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [[ ! -f "$ISCC" ]]; then choco install innosetup -y --no-progress 2>&1 | tee -a build.log; fi
          "$ISCC" packaging/installer.iss 2>&1 | tee -a build.log
          ls -l dist-installer | tee -a build.log

      - name: Сохранить установщик как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Setup
          path: dist-installer/Jarvis-Setup.exe
          retention-days: 14

      - name: Выложить в Releases
        if: needs.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HASH=$(sha256sum dist-installer/Jarvis-Setup.exe | cut -d' ' -f1)
          {
            echo "Скачайте **Jarvis-Setup.exe** и запустите. Если Джарвис уже установлен, он сам предложит обновиться."
            echo
            echo "SHA256: \`$HASH\`"
          } > notes.md
          gh release create "v$JARVIS_VERSION" dist-installer/Jarvis-Setup.exe --target "$GITHUB_SHA" \
            --title "Джарвис $JARVIS_VERSION" --notes-file notes.md 2>&1 | tee -a build.log

      - name: Сообщить о сбое задачей в репозитории
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Запуск: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '```'
            if [[ -f build.log ]]; then tail -n 150 build.log; else echo "журнала нет"; fi
            echo '```'
          } > failure.md
          gh issue create --title "Сборка v${JARVIS_VERSION:-?} не удалась" --body-file failure.md || true
